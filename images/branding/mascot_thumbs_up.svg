<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Vault-Boy Style Mascot Character with Thumbs Up (👍) -->
  <circle cx="100" cy="115" r="85" fill="#e8f8f0"/>
  <!-- Torso & Overalls -->
  <path d="M70 145 C70 130 85 125 100 125 C115 125 130 130 130 145 L135 220 H65 L70 145 Z" fill="#1bb76e"/>
  <path d="M78 130 L80 180" stroke="#13824c" stroke-width="6" stroke-linecap="round"/>
  <path d="M122 130 L120 180" stroke="#13824c" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="170" r="4" fill="#fbbf24"/>
  <circle cx="120" cy="170" r="4" fill="#fbbf24"/>
  
  <!-- Left Arm on Hip -->
  <path d="M72 138 C55 145 50 170 65 185" stroke="#ffdfba" stroke-width="12" stroke-linecap="round"/>
  <circle cx="66" cy="186" r="8" fill="#ffdfba"/>
  
  <!-- Right Arm with BIG THUMBS UP 👍 (Vault Boy pose) -->
  <path d="M128 138 C145 145 160 135 152 110" stroke="#ffdfba" stroke-width="12" stroke-linecap="round"/>
  <circle cx="152" cy="106" r="12" fill="#ffdfba"/>
  <!-- Big Thumb -->
  <path d="M152 106 C152 90 162 82 165 84 C168 86 166 98 162 106" fill="#ffdfba" stroke="#f87171" stroke-width="1.5"/>
  <path d="M152 98 L160 84" stroke="#ffdfba" stroke-width="8" stroke-linecap="round"/>
  <path d="M145 102 C145 108 152 114 158 114" stroke="#e29578" stroke-width="2"/>

  <!-- Neck & Head -->
  <rect x="92" y="110" width="16" height="18" fill="#ffdfba" rx="4"/>
  <ellipse cx="100" cy="80" rx="36" ry="32" fill="#ffdfba"/>
  <circle cx="76" cy="86" r="6" fill="#fca5a5" fill-opacity="0.6"/>
  <circle cx="124" cy="86" r="6" fill="#fca5a5" fill-opacity="0.6"/>

  <!-- Green Cap with Visor -->
  <path d="M62 65 C62 42 78 30 100 30 C122 30 138 42 138 65 H62 Z" fill="#1bb76e"/>
  <path d="M60 62 C70 56 120 54 144 60 C146 62 142 68 135 70 C105 72 70 70 60 62 Z" fill="#13824c"/>
  <circle cx="100" cy="46" r="6" fill="#ffffff"/>
  <path d="M100 42 L102 46 L106 46.5 L103 49 L104 53 L100 51 L96 53 L97 49 L94 46.5 L98 46 Z" fill="#1bb76e"/>

  <!-- Wink Eye (Vault Boy style!) -->
  <path d="M78 78 C82 74 88 74 92 78" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Open smiling eye -->
  <circle cx="116" cy="76" r="5" fill="#1e293b"/>
  <circle cx="118" cy="74" r="1.8" fill="#ffffff"/>

  <!-- Big Confident Vault Boy Grin -->
  <path d="M84 92 C88 106 112 106 116 92 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M80 91 C84 92 86 92 88 91" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 91 C114 92 116 92 120 91" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
