<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Puzzled/Searching Mascot with Magnifying Glass (Empty State) -->
  <circle cx="100" cy="100" r="90" fill="#f8fafc"/>
  <circle cx="100" cy="100" r="75" fill="#f1f5f9"/>

  <!-- Body / Shoulders -->
  <path d="M65 160 C65 140 80 135 100 135 C120 135 135 140 135 160 L140 190 H60 Z" fill="#94a3b8"/>
  <path d="M75 142 L77 190" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M125 142 L123 190" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck & Head tilted -->
  <rect x="94" y="125" width="12" height="15" fill="#ffdfba" rx="3"/>
  <g transform="rotate(-6 100 95)">
    <!-- Head -->
    <ellipse cx="100" cy="95" rx="34" ry="30" fill="#ffdfba"/>
    <circle cx="76" cy="100" r="5" fill="#fca5a5" fill-opacity="0.4"/>
    <circle cx="124" cy="100" r="5" fill="#fca5a5" fill-opacity="0.4"/>

    <!-- Green Cap -->
    <path d="M66 82 C66 60 80 48 100 48 C120 48 134 60 134 82 H66 Z" fill="#1bb76e"/>
    <path d="M64 80 C74 74 122 74 138 80 C138 84 132 87 125 88 C105 88 74 88 64 80 Z" fill="#13824c"/>
    <circle cx="100" cy="62" r="5" fill="#ffffff"/>
    <path d="M100 59L101.5 62L104.5 62.5L102 64.5L103 67.5L100 66L97 67.5L98 64.5L95.5 62.5L98.5 62L100 59Z" fill="#1bb76e"/>

    <!-- Sad/Puzzled Eyebrows -->
    <path d="M78 86 C82 88 88 88 92 84" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M108 84 C112 88 118 88 122 86" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Searching Eyes looking down/sideways -->
    <circle cx="85" cy="95" r="4" fill="#1e293b"/>
    <circle cx="115" cy="95" r="4" fill="#1e293b"/>
    <circle cx="84" cy="94" r="1.2" fill="#ffffff"/>
    <circle cx="114" cy="94" r="1.2" fill="#ffffff"/>

    <!-- Puzzled / Sad mouth -->
    <path d="M92 110 C96 106 104 106 108 110" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Big Magnifying Glass in front -->
  <g transform="translate(110, 85) rotate(-15)">
    <circle cx="30" cy="30" r="28" fill="#e0f2fe" fill-opacity="0.45" stroke="#334155" stroke-width="6"/>
    <circle cx="30" cy="30" r="23" stroke="#38bdf8" stroke-width="2"/>
    <line x1="50" y1="50" x2="75" y2="75" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
    <line x1="53" y1="53" x2="72" y2="72" stroke="#1bb76e" stroke-width="4" stroke-linecap="round"/>
    <!-- Glass reflection -->
    <path d="M16 24 C16 16 24 16 30 16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Question mark inside lens -->
    <text x="30" y="38" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#2563eb" text-anchor="middle">?</text>
  </g>
</svg>
