<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" fill="none">
  <!-- Profium Vault-Boy Mascot with Magnifying Glass (Seamless Anatomy, Leaning Left Behind Search) -->
  <defs>
    <radialGradient id="lensReflect" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Soft Mint Glow Halo -->
  <circle cx="370" cy="240" r="170" fill="#e8f8f0"/>

  <!-- Overalls fill corner bleed (ensures NO legs or waist gap ever visible) -->
  <path d="M300 480 L350 330 L520 280 L620 360 L620 480 Z" fill="#1bb76e"/>

  <!-- Character tilted -26 degrees leaning towards search -->
  <g transform="translate(415, 275) rotate(-26)">
    
    <!-- === TORSO (Green Overalls & Undershirt) === -->
    <!-- White/cream undershirt collar showing above overalls -->
    <path d="M-40 5 C-40 -15 40 -15 40 5 L45 35 L-45 35 Z" fill="#f8fafc"/>
    <path d="M-18 -5 L0 12 L18 -5" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>

    <!-- Overalls Body with natural rounded shoulders -->
    <path d="M-60 30 C-60 10 -35 5 0 5 C35 5 60 10 60 30 L85 240 L-85 240 Z" fill="#1bb76e"/>
    <!-- Bib top curve -->
    <path d="M-42 22 C-20 28 20 28 42 22 L45 75 C45 80 40 85 35 85 L-35 85 C-40 85 -45 80 -45 75 Z" fill="#16a34a"/>
    <!-- Overalls Pocket -->
    <path d="M-22 52 C-22 48 -18 45 -14 45 L14 45 C18 45 22 48 22 52 L20 72 C20 76 16 80 12 80 L-12 80 C-16 80 -20 76 -20 72 Z" fill="#15803d" stroke="#166534" stroke-width="2"/>

    <!-- Straps over shoulders -->
    <path d="M-42 12 L-36 75" stroke="url(#strapGrad)" stroke-width="13" stroke-linecap="round"/>
    <path d="M42 12 L36 75" stroke="url(#strapGrad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Golden Brass Buttons -->
    <circle cx="-36" cy="65" r="6.5" fill="#fbbf24"/>
    <circle cx="-36" cy="65" r="4" fill="#f59e0b"/>
    <circle cx="36" cy="65" r="6.5" fill="#fbbf24"/>
    <circle cx="36" cy="65" r="4" fill="#f59e0b"/>

    <!-- === RIGHT ARM (Resting on side/hip) === -->
    <path d="M52 24 C72 38 88 68 70 110" stroke="#ffdfba" stroke-width="19" stroke-linecap="round"/>
    <!-- Right sleeve cuff -->
    <circle cx="54" cy="24" r="14" fill="#15803d"/>
    <circle cx="70" cy="110" r="12" fill="#ffdfba"/>

    <!-- === LEFT ARM REACHING FORWARD WITH MAGNIFYING GLASS === -->
    <!-- Shoulder cuff -->
    <circle cx="-56" cy="24" r="15" fill="#15803d"/>
    <!-- Upper arm & Forearm bent holding glass towards eyes -->
    <path d="M-56 24 C-105 18 -132 5 -165 -15" stroke="#ffdfba" stroke-width="21" stroke-linecap="round"/>

    <!-- === MAGNIFYING GLASS (Clean physical join) === -->
    <!-- Lens Center: (-245, -80), Radius: 54 -->
    <!-- Rim connection point: (-208, -43) -->
    <!-- Handle line from hand (-165, -15) to rim (-208, -43) -->
    <line x1="-165" y1="-15" x2="-208" y2="-43" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    <line x1="-167" y1="-17" x2="-206" y2="-41" stroke="#1bb76e" stroke-width="7" stroke-linecap="round"/>
    <!-- Metal ferrule band connecting handle to rim -->
    <circle cx="-208" cy="-43" r="8" fill="#94a3b8"/>
    <circle cx="-208" cy="-43" r="6" fill="#f1f5f9"/>

    <!-- Hand firmly gripping handle -->
    <circle cx="-168" cy="-16" r="16" fill="#ffdfba"/>
    <!-- Fingers curled around handle -->
    <path d="M-160 -26 C-164 -34 -174 -34 -178 -26" stroke="#e29578" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-156 -16 C-160 -24 -170 -24 -174 -16" stroke="#e29578" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-152 -6 C-156 -14 -166 -14 -170 -6" stroke="#e29578" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Thumb over handle -->
    <path d="M-175 -24 C-170 -16 -162 -14 -158 -20" stroke="#ffdfba" stroke-width="6" stroke-linecap="round"/>

    <!-- Lens Circular Rim (Center: -245, -80) -->
    <circle cx="-245" cy="-80" r="54" fill="none" stroke="#1e293b" stroke-width="10"/>
    <circle cx="-245" cy="-80" r="54" fill="none" stroke="#64748b" stroke-width="3"/>
    <!-- Glass Lens -->
    <circle cx="-245" cy="-80" r="49" fill="url(#lensReflect)"/>
    <circle cx="-245" cy="-80" r="49" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>
    <!-- Curved Glare Highlights on Glass -->
    <path d="M-275 -102 C-275 -120 -260 -126 -242 -126" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-225" cy="-118" r="3.5" fill="#ffffff"/>

    <!-- === SOLID NECK (Seamlessly bridges head and torso) === -->
    <rect x="-15" y="-28" width="30" height="34" fill="#ffdfba" rx="5"/>
    <path d="M-12 -2 C0 6 12 -2 12 -2" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- === HEAD (Center: 0, -60) === -->
    <ellipse cx="0" cy="-60" rx="48" ry="42" fill="#ffdfba"/>
    <!-- Cheeks Blush -->
    <circle cx="-32" cy="-52" r="9" fill="#fca5a5" fill-opacity="0.65"/>
    <circle cx="32" cy="-52" r="9" fill="#fca5a5" fill-opacity="0.65"/>
    <!-- Cute Nose -->
    <path d="M-2 -58 C2 -56 5 -54 2 -50 C-1 -48 -4 -50 -3 -52" stroke="#e29578" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Ears -->
    <circle cx="-48" cy="-60" r="11" fill="#ffdfba"/>
    <circle cx="48" cy="-60" r="11" fill="#ffdfba"/>

    <!-- === GREEN CAP (Dome & Visor) === -->
    <path d="M-44 -80 C-44 -116 -22 -132 0 -132 C22 -132 44 -116 44 -80 Z" fill="#1bb76e"/>
    <!-- Visor: lowest point is -70, keeping clear of eyes at -52 -->
    <path d="M-48 -82 C-32 -90 32 -90 48 -82 C50 -78 46 -72 36 -70 C10 -68 -32 -68 -46 -72 Z" fill="#13824c"/>
    <!-- Cap Star Badge -->
    <circle cx="0" cy="-102" r="9" fill="#ffffff"/>
    <path d="M0 -109 L2.5 -103 L8.5 -102.5 L4 -98 L5.5 -92 L0 -95 L-5.5 -92 L-4 -98 L-8.5 -102.5 L-2.5 -103 Z" fill="#1bb76e"/>

    <!-- === EYES (Iconic Vault-Boy style, well below visor) === -->
    <!-- Left Eye: Wink arc (y=-50) -->
    <path d="M-28 -50 C-24 -57 -14 -57 -10 -50" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Right Eye: Open smiling eye looking at lens/search (y=-54) -->
    <ellipse cx="22" cy="-54" rx="8.5" ry="9.5" fill="#1e293b"/>
    <circle cx="24" cy="-57" r="3" fill="#ffffff"/>
    <circle cx="19" cy="-51" r="1.5" fill="#ffffff"/>

    <!-- === BIG VAULT-BOY TOOTHY GRIN === -->
    <path d="M-22 -34 C-14 -14 14 -14 22 -34 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <line x1="-22" y1="-34" x2="22" y2="-34" stroke="#1e293b" stroke-width="3"/>
    <path d="M-28 -36 C-25 -34 -22 -34 -19 -36" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M19 -36 C22 -34 25 -34 28 -36" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
